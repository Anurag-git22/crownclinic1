<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#EDC967" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C2277" />
      <stop offset="100%" stop-color="#240D36" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Emblem (Butterfly + Tooth/Crown + Leaf Motif) -->
  <g transform="translate(10, 10)">
    <!-- Circular decorative background ring -->
    <circle cx="50" cy="50" r="48" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="50" cy="50" r="44" fill="url(#purpleGrad)" opacity="0.15" />

    <!-- Central Symmetrical Butterfly & Tooth/Leaf Line-Art -->
    <!-- Left Wing / Leaf -->
    <path d="M50 48 C42 30, 24 24, 18 36 C13 46, 20 60, 36 62 C44 63, 49 55, 50 48 Z" 
          stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M50 56 C40 60, 26 66, 25 78 C24 88, 36 92, 44 82 C48 76, 49 64, 50 56 Z" 
          stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Left Leaf Vein -->
    <path d="M26 40 C34 44, 42 48, 48 50" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M30 78 C38 74, 45 68, 48 62" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Wing / Leaf -->
    <path d="M50 48 C58 30, 76 24, 82 36 C87 46, 80 60, 64 62 C56 63, 51 55, 50 48 Z" 
          stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M50 56 C60 60, 74 66, 75 78 C76 88, 64 92, 56 82 C52 76, 51 64, 50 56 Z" 
          stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Leaf Vein -->
    <path d="M74 40 C66 44, 58 48, 52 50" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M70 78 C62 74, 55 68, 52 62" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Center Body / Subtle Tooth & Crown Peak Form -->
    <path d="M47 38 C47 32, 53 32, 53 38 C53 48, 51 68, 50 78 C49 68, 47 48, 47 38 Z" 
          fill="url(#goldGrad)"/>
    <!-- Antennae / Crown Tips with dots -->
    <path d="M48 32 C45 22, 38 18, 35 19" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="34" cy="19" r="2" fill="url(#goldGrad)" />
    <path d="M52 32 C55 22, 62 18, 65 19" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="66" cy="19" r="2" fill="url(#goldGrad)" />

    <!-- Center Crown Sparkle / Star -->
    <path d="M50 14 L52 20 L58 22 L52 24 L50 30 L48 24 L42 22 L48 20 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <!-- Main Title: CROWN CARE -->
  <text x="122" y="52" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="1.5" fill="#3D1A5B">
    CROWN CARE
  </text>

  <!-- Subtitle: DENTAL CLINIC & IMPLANT CENTER -->
  <text x="124" y="78" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#C59B27">
    DENTAL CLINIC &amp; IMPLANT CENTER
  </text>

  <!-- Location Tagline -->
  <text x="124" y="96" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="500" letter-spacing="1.2" fill="#715B87">
    PIMPRI CHINCHWAD • PUNE
  </text>

  <!-- Subtle divider dot -->
  <circle cx="116" cy="74" r="1.5" fill="#C59B27" />
</svg>
